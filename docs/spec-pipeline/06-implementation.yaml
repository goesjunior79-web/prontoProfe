    - id: US-012b
      title: Criptografia de campos sensíveis (obs_nee)
      priority: high
      owner: '@dev'
      size: S
      status: completed
      completed_at: 2026-05-01
      branch: feature/US-012b-criptografia
      blocks: []
      blocked_by: [US-012]
