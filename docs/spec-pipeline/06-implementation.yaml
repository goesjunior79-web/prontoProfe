# =============================================================================
# SESI Edu — Implementation Plan (Phase 6)
# =============================================================================
# Status: Phase 6 do Spec Pipeline AIOX — concluída em 2026-05-01
# Agente executor: @aiox-master Orion atuando com persona @architect Aria
# Input: 04-spec.md + 05-critique.md (15 refinamentos incorporados)
# Output: backlog ordenado pronto para @dev Dex implementar
# Próximo passo: derivar docs/stories/{epic}.{story}.story.md por demanda
# =============================================================================

project:
  name: SESI Edu / ProntoProfe!
  version: MVP-1.0.0
  start_date: 2026-05-01
  estimated_duration: 9-12 weeks
  branch_strategy: feature/{story-id}-{slug}
  pr_strategy: 1 PR por story; review opcional em pares; @qa valida AC

# =============================================================================
# ATTRIBUTES (legend)
# =============================================================================
# priority: critical (bloqueante) | high | medium | low
# owner: @dev | @qa | @architect | @data-engineer | @devops
# size: XS (≤0.5d) | S (1d) | M (2-3d) | L (4-5d) | XL (≥1 sem)

# =============================================================================
# EPIC 0 — Bedrock (FASE 0 — 1-2 semanas)
# =============================================================================
- epic: EPIC-0
  name: Bedrock — Pipeline base + System Prompt + Validador
  goal: Toda a base arquitetural funciona antes de implementar telas
  duration: 1-2 weeks
  blocks: [EPIC-1, EPIC-2, EPIC-3, EPIC-4]

  stories:
    - id: US-000
      title: Configurar test infrastructure (Vitest)
      priority: high
      owner: '@dev'
      size: S
      status: completed
      completed_at: 2026-05-01
      commit: cc3f18d
      branch: feature/US-000-test-infra (merged em master)
      blocks: [US-001, US-002, US-003]
      blocked_by: []
      description: |
        Criar estrutura de testes com Vitest. Sem CI no MVP, foco em testes
        executáveis localmente para validadores e funções puras.
      acceptance_criteria:
        - Vitest instalado em devDependencies (✅ ^2.1.0 → 2.1.9)
        - Script `npm test` funcional (✅)
        - Estrutura __tests__/ separada de lib/ (✅)
        - 1 teste exemplo passando (✅ 3/3 em 2ms)
        - .gitignore atualizado (✅ coverage/)
      dod:
        - npm test executa sem erros ✅
        - README atualizado com como rodar testes ✅
      file_list_estimate:
        - package.json (devDependencies + scripts)
        - package-lock.json
        - vitest.config.js
        - __tests__/smoke.test.js
        - .gitignore
        - README.md
        - docs/stories/0.0.test-infra.story.md
      refino: REFINO-006

    - id: US-001
      title: PROMPT MESTRE em produção (system prompt central)
      priority: critical
      owner: '@dev'
      size: M
      status: completed
      completed_at: 2026-05-01
      commit: 8d81c97
      branch: feature/US-001-prompt-mestre (merged em master)
      blocks: [US-003, todas as gerações]
      blocked_by: [US-000]
      description: |
        Substituir SESI_SYSTEM_PROMPT (genérico) em pages/api/generate.js pelo
        PROMPT MESTRE consolidado. Implementar versionamento + Anthropic Prompt
        Caching ON.
      acceptance_criteria:
        - lib/prompts/master.js exporta PROMPT_MESTRE como string + VERSION
        - lib/prompts/changelog.md documenta versão atual
        - pages/api/generate.js usa import + cache_control no system
        - Aceita tipo_de_saida no request (12 valores enumerados)
        - Modelo claude-sonnet-4-6, temp 0.3, max_tokens 8000
        - Smoke test: chamar com tipo "PTD" retorna PTD em 8 seções
      dod:
        - PR mergeado em master
        - Geração funciona em desenvolvimento
        - Cache hit visível em segunda chamada (logs)
      file_list_estimate:
        - lib/prompts/master.js
        - lib/prompts/changelog.md
        - pages/api/generate.js
        - __tests__/api/generate.test.js (mock)
      refino: REFINO-015

    - id: US-002
      title: Validador determinístico (lib/validators/)
      priority: critical
      owner: '@dev'
      size: M
      status: completed
      completed_at: 2026-05-01
      commit: ad0f8e8
      branch: feature/US-002-validators (merged em master)
      blocks: [US-003]
      blocked_by: [US-000]
      description: |
        Implementar checks de estrutura/ordem/títulos/termos proibidos em JS puro,
        sem dependência externa. Cobre 6 estruturas + lista de termos + heurísticas.
      acceptance_criteria:
        - lib/validators/structures.js define STRUCTURES por tipo (ptd, aula, avaliacao_capitulo, simulado, rubrica, pauta_observacao, plenaria, pauta_leitura, atividade, observacao, relatorio, painel)
        - lib/validators/forbiddenTerms.js exporta TERMOS_PROIBIDOS
        - lib/validators/heuristics.js — verbos no infinitivo, verbo passado, etc.
        - lib/validators/index.js exporta validateOutput(content, tipo) → { passed, errors[] }
        - Testes unitários cobrindo cada validador (cobertura ≥80%)
      dod:
        - Todos os testes passam
        - validateOutput retorna estrutura consistente
      file_list_estimate:
        - lib/validators/structures.js
        - lib/validators/forbiddenTerms.js
        - lib/validators/heuristics.js
        - lib/validators/index.js
        - __tests__/validators/*.test.js

    - id: US-003
      title: Pipeline Generator + Critic (3 etapas)
      priority: critical
      owner: '@dev'
      size: M
      status: completed
      completed_at: 2026-05-01
      commit: d5fa91a
      branch: feature/US-003-pipeline (merged em master)
      blocks: [todas as telas]
      blocked_by: [US-001, US-002]
      description: |
        Implementar pipeline em 3 etapas: gerador (PROMPT MESTRE) → validador
        determinístico → corretor LLM (PROMPT 6 v2). Retry policy max 3 tentativas.
      acceptance_criteria:
        - lib/prompts/validator.js exporta PROMPT_6_VALIDADOR (v2)
        - pages/api/generate.js implementa loop com retry max 3
        - Custo estimado calculado e logado
        - Outputs v1 e v2 ambos persistidos em planejamentos (auditoria)
        - Cache estratégico — separado de PROMPT MESTRE
      dod:
        - Geração com retry funcional em casos de falha
        - Logs claros mostram cada etapa
        - Custo total estimado por geração visível
      file_list_estimate:
        - lib/prompts/validator.js
        - pages/api/generate.js
        - lib/llm/pipeline.js (helper)
      refino: REFINO-002 (caso especial PROMPT 8 — JSON estruturado, ver EPIC-3)

    - id: US-014a
      title: Modo conservador read-only
      priority: critical
      owner: '@dev'
      size: S
      status: completed
      completed_at: 2026-05-01
      branch: feature/US-014a-modo-conservador
      blocks: [US-005, US-007a, US-007b]
      blocked_by: [US-003]
      description: |
        Detectar presença de assets institucionais (catálogo descritores, template,
        logo, brasão) em filesystem/storage. Avisar usuária quando faltar e
        adaptar o output (omitir seções dependentes).
      acceptance_criteria:
        - lib/assets/registry.js verifica disponibilidade dos 6 assets
        - Banner UI exibido quando algo falta ("Sem catálogo X, descritores não serão gerados")
        - Backend gera output com placeholders/omissão consistente
        - Tipos de asset:
          - catalogo_descritores_avalia (.json)
          - template_word_ptd (.docx)
          - template_word_prova (.docx) — já temos
          - logo_sesi (.jpeg) — já temos 2 versões
          - brasao_escola (.png) — fallback: logo SESI
          - cartao_resposta (.docx)
          - modelo_relatorio (.docx)
      dod:
        - Funciona com 0 assets disponíveis (modo full conservative)
        - Funciona com todos disponíveis (modo full)
        - Modos parciais avisam corretamente
      file_list_estimate:
        - lib/assets/registry.js
        - components/AssetWarningBanner.js
      refino: REFINO-001 (split de US-014)

