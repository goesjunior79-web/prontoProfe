        - user_id consistente entre sessões
      file_list_estimate:
        - pages/api/auth/[...nextauth].js
        - lib/db/users.js
        - supabase/migrations/002_usuarios.sql (se separar)
      refino: REFINO-003

    - id: US-012
      title: Cadastro de alunos com consentimento LGPD
      priority: high
      owner: '@dev'
      size: M
      status: completed
      completed_at: 2026-05-01
      branch: feature/US-012-alunos-lgpd
      blocks: [US-009, US-010, US-011a]
      blocked_by: [US-004a]
      description: |
        Refactor AlunosModal com checkbox de consentimento + texto LGPD. Migrar
